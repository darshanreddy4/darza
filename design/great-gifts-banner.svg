    <path d="M500,505 Q560,560 620,505 L650,530 Q560,590 470,530 Z" fill="#ffffff"/>
    <g fill="#e7cf9c" opacity="0.8">
      <circle cx="430" cy="640" r="9"/><circle cx="690" cy="660" r="9"/><circle cx="560" cy="720" r="9"/>
      <circle cx="470" cy="740" r="7"/><circle cx="650" cy="750" r="7"/>
    </g>
    <path d="M700,560 L905,468" stroke="url(#jacket)" stroke-width="64" stroke-linecap="round" fill="none"/>
    <circle cx="935" cy="452" r="38" fill="#ffd9b8"/>
    <path d="M940,420 Q975,380 1000,372" stroke="#ffd9b8" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M920,430 Q920,400 940,395" stroke="#ffd9b8" stroke-width="22" stroke-linecap="round" fill="none"/>
    <path d="M425,570 Q380,640 430,690" stroke="url(#jacket)" stroke-width="62" stroke-linecap="round" fill="none"/>

    <rect x="385" y="660" width="150" height="120" rx="14" fill="#ff6b81"/>
    <rect x="375" y="640" width="170" height="40" rx="12" fill="#ff8a9b"/>
    <rect x="445" y="640" width="30" height="140" fill="url(#gold)"/>
    <path d="M460,640 C420,590 390,610 410,636 C425,652 450,646 460,640Z M460,640 C500,590 530,610 510,636 C495,652 470,646 460,640Z" fill="url(#gold)"/>
    <circle cx="395" cy="705" r="30" fill="#ffd9b8"/>

    <circle cx="372" cy="345" r="30" fill="#ffd9b8"/>
    <circle cx="748" cy="345" r="30" fill="#ffd9b8"/>
    <ellipse cx="560" cy="335" rx="190" ry="175" fill="#ffe0c2"/>
    <path d="M368,330 C360,150 470,112 560,112 C660,112 760,155 752,330 C715,255 650,215 560,215 C470,215 405,255 368,330Z" fill="#3b2a26"/>
    <path d="M530,118 C515,70 575,60 590,100 C600,70 640,80 615,120Z" fill="#3b2a26"/>
    <path d="M440,250 Q520,200 600,225" stroke="#5a443d" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.6"/>

    <ellipse cx="495" cy="350" rx="23" ry="33" fill="#2b1d1a"/>
    <ellipse cx="625" cy="350" rx="23" ry="33" fill="#2b1d1a"/>
    <circle cx="504" cy="336" r="9" fill="#fff"/><circle cx="634" cy="336" r="9" fill="#fff"/>
    <circle cx="488" cy="366" r="4.5" fill="#fff"/><circle cx="618" cy="366" r="4.5" fill="#fff"/>
    <ellipse cx="450" cy="415" rx="32" ry="18" fill="#ff9aa8" opacity="0.7"/>
    <ellipse cx="670" cy="415" rx="32" ry="18" fill="#ff9aa8" opacity="0.7"/>
    <path d="M526,412 Q560,462 594,412 Q560,424 526,412Z" fill="#8b2e3a"/>
    <path d="M540,432 Q560,450 580,432 Q560,438 540,432Z" fill="#ff8da1"/>
  </g>

  <g fill="url(#cloud)" filter="url(#soft)" transform="translate(0 55)">
    <ellipse cx="520" cy="835" rx="330" ry="70"/>
    <ellipse cx="380" cy="800" rx="150" ry="70"/>
    <ellipse cx="640" cy="790" rx="170" ry="80"/>
    <ellipse cx="1170" cy="850" rx="190" ry="45"/>
    <ellipse cx="1090" cy="835" rx="100" ry="45"/>
    <ellipse cx="1950" cy="830" rx="300" ry="70"/>
    <ellipse cx="1830" cy="795" rx="150" ry="70"/>
    <ellipse cx="2060" cy="790" rx="130" ry="65"/>
