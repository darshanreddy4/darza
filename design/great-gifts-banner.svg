<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1500" width="2400" height="1500">
  <defs>
    <linearGradient id="outer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="900">
      <stop offset="0" stop-color="#2146b8"/>
      <stop offset="1" stop-color="#2f62e0"/>
    </linearGradient>
    <linearGradient id="panel" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="900">
      <stop offset="0" stop-color="#5b93ff"/>
      <stop offset="0.5" stop-color="#3b72f2"/>
      <stop offset="1" stop-color="#2f62e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.38" r="0.35">
      <stop offset="0" stop-color="#9cc0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9cc0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a6"/>
      <stop offset="0.5" stop-color="#f6c556"/>
      <stop offset="1" stop-color="#d9961f"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="1" stop-color="#f3c46a"/>
    </linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a58d6"/>
      <stop offset="0.45" stop-color="#6aa0ff"/>
      <stop offset="1" stop-color="#2a58d6"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7dcff"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf0d6"/>
      <stop offset="1" stop-color="#ecd9ae"/>
    </linearGradient>
    <symbol id="spark" viewBox="-50 -50 100 100" overflow="visible">
      <path d="M0,-50 Q7,-7 50,0 Q7,7 0,50 Q-7,7 -50,0 Q-7,-7 0,-50Z" fill="url(#gold)"/>
    </symbol>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1f6b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="panelClip">
      <path d="M240,300 C300,200 480,230 700,170 C900,115 1050,140 1200,95 C1350,140 1500,115 1700,170 C1920,230 2100,200 2160,300 L2160,1500 L240,1500 Z"/>
    </clipPath>
  </defs>

  <rect width="2400" height="1500" fill="url(#outer)"/>

  <path d="M240,300 C300,200 480,230 700,170 C900,115 1050,140 1200,95 C1350,140 1500,115 1700,170 C1920,230 2100,200 2160,300 L2160,1500 L240,1500 Z" fill="url(#panel)"/>
  <g clip-path="url(#panelClip)">
    <rect x="240" y="0" width="1920" height="1500" fill="url(#glow)"/>
    <g fill="#ffffff" opacity="0.5">
      <circle cx="900" cy="300" r="4"/><circle cx="1350" cy="250" r="5"/><circle cx="1980" cy="430" r="4"/>
      <circle cx="760" cy="640" r="3"/><circle cx="1180" cy="700" r="4"/><circle cx="1760" cy="720" r="3"/>
      <circle cx="1060" cy="230" r="3"/><circle cx="1600" cy="640" r="4"/>
    </g>
  </g>

  <path d="M240,300 C300,200 480,230 700,170 C900,115 1050,140 1200,95 C1350,140 1500,115 1700,170 C1920,230 2100,200 2160,300" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round"/>
  <path d="M262,318 C320,225 490,250 705,192 C905,138 1050,162 1200,118 C1350,162 1495,138 1695,192 C1910,250 2080,225 2138,318" fill="none" stroke="#ffe9a6" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#soft)">
    <circle cx="1130" cy="112" r="30" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <circle cx="1270" cy="112" r="30" fill="none" stroke="url(#gold)" stroke-width="12"/>
    <use href="#spark" x="1200" y="100" width="150" height="150" transform="translate(-75 -75)"/>
  </g>
  <use href="#spark" x="1900" y="240" width="110" height="110" transform="translate(-55 -55)" filter="url(#soft)"/>
  <use href="#spark" x="1420" y="236" width="36" height="36" transform="translate(-18 -18)" opacity="0.9"/>

  <g id="col-left" filter="url(#soft)">
    <rect x="178" y="330" width="124" height="470" fill="url(#column)"/>
    <rect x="150" y="300" width="180" height="56" rx="26" fill="url(#gold)"/>
    <rect x="164" y="520" width="152" height="40" rx="18" fill="url(#gold)"/>
    <rect x="164" y="566" width="152" height="34" rx="16" fill="url(#gold)"/>
    <use href="#spark" x="240" y="440" width="70" height="70" transform="translate(-35 -35)"/>
  </g>
  <g id="col-right" filter="url(#soft)">
    <rect x="2098" y="330" width="124" height="470" fill="url(#column)"/>
    <rect x="2070" y="300" width="180" height="56" rx="26" fill="url(#gold)"/>
    <rect x="2084" y="520" width="152" height="40" rx="18" fill="url(#gold)"/>
    <rect x="2084" y="566" width="152" height="34" rx="16" fill="url(#gold)"/>
    <use href="#spark" x="2160" y="440" width="70" height="70" transform="translate(-35 -35)"/>
  </g>

  <g font-family="'Arial Rounded MT Bold','Avenir Next','Helvetica Neue',Arial,sans-serif" font-weight="800" text-anchor="middle">
    <text x="1540" y="400" font-size="124" fill="#ffffff" textLength="760" lengthAdjust="spacingAndGlyphs" filter="url(#soft)">Great gifts,</text>
    <text x="1540" y="555" font-size="156" fill="url(#goldText)" textLength="930" lengthAdjust="spacingAndGlyphs" filter="url(#soft)">great savings</text>
  </g>
  <g>
    <rect x="1110" y="640" width="360" height="5" rx="2.5" fill="url(#gold)"/>
    <rect x="1610" y="640" width="360" height="5" rx="2.5" fill="url(#gold)"/>
    <use href="#spark" x="1540" y="642" width="56" height="56" transform="translate(-28 -28)"/>
  </g>

  <g id="avatar" filter="url(#soft)" transform="translate(80 175) scale(0.85)">
